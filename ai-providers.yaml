# ai-providers.yaml
# Interface configuration ONLY (endpoints, timeouts, concurrency, breakers,
# per-role behavior knobs). Which model each role uses is defined in
# model-info.yml (model catalog + roles routing).
# Shared by the Spring Boot backend (Spring AI) and this Python LangGraph service.
# Author: Wang, Bing <colin2wang@gmail.com>

ai:
  providers:
    # 1) LM Studio local inference (OpenAI compatible).
    #    Spring AI appends /v1 automatically; the Python factory also appends /v1.
    #    Therefore base-url must stay bare (no /v1 suffix).
    - name: lmstudio-local
      type: lmstudio
      base-url: http://localhost:1234
      api-key: lm-studio
      timeout-seconds: 600
      connect-timeout-seconds: 10
      max-tokens: 8192
      max-concurrency: 2
      capabilities:
        chat: true
        tool-calls: partial
        json-schema: true
        embeddings: true

    # 2) Ollama local service (OpenAI compatible /v1 endpoint).
    - name: ollama-local
      type: ollama
      base-url: http://localhost:11434
      api-key: ollama
      timeout-seconds: 600
      connect-timeout-seconds: 10
      max-tokens: 4096
      max-concurrency: 2
      capabilities:
        chat: true
        tool-calls: partial
        json-schema: true
        embeddings: true

  # Role-level behavior knobs only; model routing lives in model-info.yml.
  roles:
    extractor:
      temperature: 0.1
      structured-output: json_schema
    summarizer:
      temperature: 0.3
      structured-output: json_mode
      # Light, latency-sensitive role: "none" is the only API-level switch
      # that disables Qwen3 thinking on LM Studio (chat_template_kwargs is
      # ignored by LM Studio's OpenAI-compatible path).
      reasoning-effort: none
    linker:
      temperature: 0.0
      structured-output: json_schema
    memory-manager:
      temperature: 0.2
      reasoning-effort: none

  embeddings:
    provider: lmstudio-local
    model: bge-m3
    dims: 1024
    batch-size: 32

  rerank:
    provider: local-tei
    base-url: http://localhost:8090
    model: bge-reranker-v2-m3

  embeddings:
    provider: lmstudio-local
    model: bge-m3
    dims: 1024
    batch-size: 32

  rerank:
    provider: local-tei
    base-url: http://localhost:8090
    model: bge-reranker-v2-m3

  fallback-policy:
    health-probe-seconds: 30
    breaker:
      failure-threshold: 3
      open-seconds: 120
