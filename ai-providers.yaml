# ai-providers.yaml
# Single source of truth for AI provider configuration.
# Shared by the Spring Boot backend (Spring AI) and this Python LangGraph service.
# Author: Wang, Bing <colin2wang@gmail.com>

ai:
  providers:
    # 1) LM Studio local inference (OpenAI compatible).
    #    Spring AI appends /v1 automatically; the Python factory also appends /v1.
    #    Therefore base-url must stay bare (no /v1 suffix).
    - name: lmstudio-local
      type: lmstudio
      base-url: http://localhost:1234
      api-key: lm-studio
      timeout-seconds: 600
      connect-timeout-seconds: 10
      max-tokens: 8192
      max-concurrency: 2
      capabilities:
        chat: true
        tool-calls: partial
        json-schema: true
        embeddings: true
      models:
        chat: qwen2.5-32b-instruct
        embed: bge-m3

    # 2) Ollama local service (OpenAI compatible /v1 endpoint).
    - name: ollama-local
      type: ollama
      base-url: http://localhost:11434
      api-key: ollama
      timeout-seconds: 600
      connect-timeout-seconds: 10
      max-tokens: 4096
      max-concurrency: 2
      capabilities:
        chat: true
        tool-calls: partial
        json-schema: true
        embeddings: true
      models:
        chat: qwen2.5:14b
        embed: bge-m3

  # Role-based routing: LangGraph nodes request models by role.
  roles:
    extractor:
      primary: lmstudio-local/qwen2.5-32b-instruct
      fallback: [ollama-local/qwen2.5:14b]
      temperature: 0.1
      structured-output: json_schema
    summarizer:
      primary: ollama-local/qwen2.5:14b
      fallback: []
      temperature: 0.3
      structured-output: json_mode
    linker:
      primary: lmstudio-local/qwen2.5-32b-instruct
      fallback: [ollama-local/qwen2.5:14b]
      temperature: 0.0
      structured-output: json_schema
    memory-manager:
      primary: ollama-local/qwen2.5:14b
      fallback: []
      temperature: 0.2

  embeddings:
    provider: lmstudio-local
    model: bge-m3
    dims: 1024
    batch-size: 32

  rerank:
    provider: local-tei
    base-url: http://localhost:8090
    model: bge-reranker-v2-m3

  fallback-policy:
    health-probe-seconds: 30
    breaker:
      failure-threshold: 3
      open-seconds: 120
